<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Log App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./style.css">
</head> 
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="navbar navbar-expand-lg d-flex justify-content-around px-3 py-4">
                    <a href="#" class="navbar-brand d-flex align-items-center fw-bold text-white">
                        <i class="bi bi-person-check me-2 icon"></i>
                        <h2 class="mt-2">Attendance Log App</h2>
                    </a>
                </div>
            </div>

            <div class="col-md-6 col-12 mx-auto my-5">
                <form action="" class="p-3 rounded-3">
                    <h3 class="text-center mb-3" >Add Student</h3>

                    <label for="studentName" class="form-label ms-1 fw-bold">Student Name</label>
                    <input type="text" id="studentName" name="studentName" class="form-control mb-4" placeholder="Enter a student Name">

                    <label class="fw-bold">Student Status:</label>
                    <div class="d-flex justify-content-around" id="studentStatus">
                        <div>
                            <input id="present" name="status" type="radio" class="form-check-input">
                            <label for="present" class="form-label ms-1">present</label>
                        </div>

                        <div>
                            <input id="absent" name="status" type="radio" class="form-check-input">
                            <label for="absent" class="form-label ms-1">absent</label>
                        </div>
                    </div>
                    <button type="button" id="submit" class="btn btn-two text-white w-100 rounded-pill mt-4">Add Student</button>
                </form>     
            </div>

            <div class="row">
                <div class="col-md-6 mx-auto">
                    <div class="all-btn d-flex justify-content-around my-2">
                        <button onclick="showData()" class="border-0 text-white rounded-pill btn-three px-3 p-2">All Students</button>
                        <button onclick="showPresent()" class="border-0 text-white rounded-pill btn-three px-3 p-2">Present Students</button>
                        <button onclick="showAbsent()" class="border-0 text-white rounded-pill btn-three px-3 p-2">Absent Students</button>
                    </div>
                </div>

                <div class="col-md-10 mx-auto my-5">
                    <table class="w-100">
                        <div class="d-flex justify-content-evenly mb-2">
                            <span id="totalCount" class="badge">Total Student</span>
                            <span id="presentCount" class="badge">Student Present</span>
                            <span id="absentCount" class="badge">Student Absent</span>
                        </div>
                        <thead>
                            <tr class="text-white">
                                <th class="p-3">ID</th>
                                <th class="p-3">STUDENT NAME</th>
                                <th class="p-3">STUDENT STATUS</th>
                                <th class="p-3">UPDATE</th>
                                <th class="p-3">DELETE</th>
                            </tr>
                        </thead>

                        <tbody id="tbody">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="./javascript.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
